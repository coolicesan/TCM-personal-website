<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --paper:#F2F1E6;
    --paper-card:#FBFAF4;
    --ink:#262420;
    --ink-soft:#5A554C;
    --ink-faint:#8B8579;
    --pine:#1F3A30;
    --pine-deep:#15281F;
    --pine-tint:#E4EAE4;
    --amber:#B9863F;
    --amber-deep:#8E661F;
    --amber-soft:#F1E3C8;
    --cinnabar:#9C3B2E;
    --cinnabar-deep:#7C2E23;
    --cinnabar-soft:#F3DCD6;
    --jade-mist:#DCE3D6;
    --jade-line:#9FB5A4;
    --line:#D8D4C5;
    --shadow:0 1px 2px rgba(38,36,32,.04), 0 8px 24px -12px rgba(38,36,32,.18);
    --radius:14px;
    --radius-sm:8px;
    --maxw:760px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(159,181,164,.18), transparent 60%),
      radial-gradient(ellipse 50% 35% at 100% 10%, rgba(185,134,63,.10), transparent 60%);
    color:var(--ink);
    font-family:'Noto Sans TC','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  h1,h2,h3,.zh-display{font-family:'Noto Serif TC','Spectral',serif;}
  .en{
    font-family:'Spectral','Inter',serif;
    font-style:italic;
    color:var(--ink-faint);
    letter-spacing:.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:.04em;}
  a{color:var(--pine);}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--amber); outline-offset:2px; border-radius:4px;}

  /* ============ SITE NAV (matches main site) ============ */
  .site-nav{
    position:sticky; top:0; z-index:100;
    background:rgba(250,247,240,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #E9E0D0;
  }
  .site-nav-inner{
    max-width:1180px; margin:0 auto;
    padding:.85rem 20px;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    position:relative;
  }
  .site-logo{ text-decoration:none; line-height:1.3; }
  .site-logo .logo-name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:1.15rem; color:#4A4038; display:block; }
  .site-logo .logo-sub{ font-size:.7rem; letter-spacing:.16em; color:#857A6E; display:block; }
  .site-links{ display:flex; align-items:center; gap:clamp(.9rem,2.2vw,1.7rem); }
  .site-links a{ text-decoration:none; font-size:.92rem; font-weight:500; color:#857A6E; padding:.35rem 0; border-bottom:2px solid transparent; transition:color .2s,border-color .2s; }
  .site-links a:hover{ color:#8A6F55; border-color:#C9AC80; }
  .site-cta{ background:#A98D72; color:#fff !important; padding:.55rem 1.25rem !important; border-radius:999px; border-bottom:none !important; transition:background .2s; }
  .site-cta:hover{ background:#8A6F55; }
  .site-toggle{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px; }
  .site-toggle span{ width:22px; height:2px; background:#4A4038; border-radius:2px; }
  @media (max-width:760px){
    .site-links{ position:absolute; top:100%; left:0; right:0; background:#FAF7F0; border-bottom:1px solid #E9E0D0; flex-direction:column; align-items:stretch; gap:0; padding:.6rem 20px 1.2rem; display:none; }
    .site-links.open{ display:flex; }
    .site-links a{ padding:.8rem .3rem; border-bottom:1px solid #E9E0D0; }
    .site-cta{ margin-top:.8rem; text-align:center; border-radius:8px !important; }
    .site-toggle{ display:flex; }
  }

  /* ============ UNIFIED INTRO (matches main site hero) ============ */
  .intro-hero .eyebrow{
    font-family:'Noto Serif TC',serif;
    letter-spacing:.2em; text-transform:none;
    font-size:13px; font-weight:600; color:#8A6F55; margin-bottom:14px;
  }
  .intro-hero .intro-title{
    font-family:'Noto Serif TC',serif; font-weight:700;
    font-size:clamp(26px,4.6vw,38px); line-height:1.4; color:#3B332C; margin:0;
  }
  .intro-hero .intro-title em{
    font-style:normal; color:#8A6F55;
    background:linear-gradient(transparent 68%, #EFE5D2 68%);
  }
  .gold-thread{ display:inline-flex; align-items:center; gap:6px; margin:16px 0 10px; }
  .gold-thread::before{ content:''; width:46px; height:2px; border-radius:2px; background:linear-gradient(90deg,#A98D72,#C9AC80); }
  .gold-thread::after{ content:''; width:6px; height:6px; border-radius:50%; background:#C9AC80; }
  .btn-begin{
    background:linear-gradient(135deg,#A98D72,#8A6F55) !important;
    color:#fff !important;
    box-shadow:0 6px 18px rgba(138,111,85,.3);
  }
  .btn-begin:hover{ background:#8A6F55 !important; transform:translateY(-1px); }

  /* ============ APP SHELL ============ */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
    display:grid;
    grid-template-columns:220px 1fr;
    gap:36px;
    align-items:start;
  }
  @media (max-width:880px){
    .app{grid-template-columns:1fr; padding:16px 14px 64px;}
  }


  /* ============ HEADER / BRAND ============ */
  .brand{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:6px;
    padding:4px 2px;
  }
  .brand-mark{flex:none;}
  .brand-text h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .brand-text .en{font-size:12px; display:block; margin-top:1px;}

  /* ============ MERIDIAN STEPPER (signature element) ============ */
  .meridian{
    position:sticky;
    top:24px;
    display:flex;
    flex-direction:column;
    gap:0;
    padding:18px 4px;
  }
  .meridian-node{
    display:flex;
    align-items:flex-start;
    gap:12px;
    position:relative;
    padding-bottom:30px;
    cursor:default;
  }
  .meridian-node:last-child{padding-bottom:0;}
  .meridian-node::before{
    content:'';
    position:absolute;
    left:13px; top:28px; bottom:0;
    width:2px;
    background:var(--jade-mist);
  }
  .meridian-node:last-child::before{display:none;}
  .meridian-node.is-done::before{background:var(--pine);}
  .node-dot{
    flex:none;
    width:28px; height:28px;
    border-radius:50%;
    background:var(--paper-card);
    border:2px solid var(--jade-mist);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC',serif;
    font-size:13px; font-weight:700;
    color:var(--ink-faint);
    transition:box-shadow .35s ease, border-color .35s ease, background .35s ease, color .35s ease;
  }
  .meridian-node.is-done .node-dot{
    background:var(--pine); border-color:var(--pine); color:var(--paper);
  }
  .meridian-node.is-active .node-dot{
    border-color:var(--cinnabar);
    color:var(--cinnabar-deep);
    box-shadow:0 0 0 6px rgba(156,59,46,.12), 0 0 18px 2px rgba(156,59,46,.18);
  }
  .node-label{padding-top:3px;}
  .node-label .zh{display:block; font-size:14px; font-weight:500; color:var(--ink-soft);}
  .meridian-node.is-active .node-label .zh{color:var(--ink); font-weight:700;}
  .node-label .en{display:block; font-size:11px; margin-top:1px;}

  .meridian-mobile{display:none;}
  @media (max-width:880px){
    .meridian{display:none;}
    .meridian-mobile{
      display:flex; gap:8px; overflow-x:auto;
      padding:4px 2px 14px;
      grid-column:1/-1;
      -webkit-overflow-scrolling:touch;
    }
    .mm-dot{
      flex:none; width:30px;height:30px;border-radius:50%;
      border:2px solid var(--jade-mist); background:var(--paper-card);
      display:flex;align-items:center;justify-content:center;
      font-family:'Noto Serif TC',serif; font-size:12px; font-weight:700; color:var(--ink-faint);
    }
    .mm-dot.is-done{background:var(--pine);border-color:var(--pine);color:var(--paper);}
    .mm-dot.is-active{border-color:var(--cinnabar); color:var(--cinnabar-deep); box-shadow:0 0 0 5px rgba(156,59,46,.12);}
  }

  /* ============ MAIN PANEL ============ */
  main{min-width:0;}
  .panel{
    background:var(--paper-card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border-top:3px solid var(--amber);
    padding:32px clamp(18px,4vw,44px) 36px;
    max-width:var(--maxw);
    animation:rise .45s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .eyebrow{
    font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--amber-deep); font-weight:600; margin-bottom:8px;
  }
  .panel h2{font-size:24px; margin:0 0 4px;}
  .panel .section-en{font-size:13px; margin:0 0 22px;}

  .intro-title{font-size:30px; margin:6px 0 2px; line-height:1.3;}
  .intro-sub{font-size:15px; margin:0 0 22px;}
  .intro-copy{font-size:14.5px; color:var(--ink-soft); margin:0 0 14px;}
  .intro-meta{
    display:flex; gap:18px; flex-wrap:wrap;
    margin:20px 0 26px; font-size:13px; color:var(--ink-soft);
  }
  .intro-meta b{color:var(--ink); font-weight:600;}

  .disclaimer{
    background:var(--pine-tint);
    border-left:3px solid var(--pine);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    padding:14px 16px;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 24px;
  }
  .disclaimer b{color:var(--pine);}

  /* ============ QUESTIONS ============ */
  .q-block{margin-bottom:30px;}
  .q-block:last-child{margin-bottom:0;}
  .q-label{font-size:15.5px; font-weight:500; margin:0 0 2px; color:var(--ink);}
  .q-label .num{
    display:inline-block; min-width:22px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--amber-deep);
    margin-right:6px;
  }
  .q-en{font-size:12.5px; margin:0 0 12px;}
  .q-hint{font-size:12.5px; color:var(--ink-faint); margin:-8px 0 12px;}

  .opt-grid{display:flex; flex-wrap:wrap; gap:9px;}
  .opt{
    border:1.5px solid var(--line);
    background:var(--paper);
    border-radius:999px;
    padding:9px 16px;
    font-size:13.5px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
    text-align:left;
    line-height:1.3;
  }
  .opt .en{font-size:10.5px;}
  .opt:hover{border-color:var(--pine);}
  .opt.is-selected{
    background:var(--pine); border-color:var(--pine); color:var(--paper);
  }
  .opt.is-selected .en{color:rgba(242,241,230,.75);}
  .opt-grid.is-block .opt{width:100%;}

  .field-num, .field-text, .field-date{
    width:100%; max-width:260px;
    padding:10px 13px;
    border:1.5px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius-sm);
    font-size:14px; color:var(--ink);
    font-family:inherit;
  }
  .field-text.wide{max-width:100%;}
  textarea.field-text.wide{min-height:78px; resize:vertical; font-family:inherit;}
  .unit{font-size:13px; color:var(--ink-soft); margin-left:8px;}

  /* ---- range slider (pain scale etc.) ---- */
  .slider-wrap{max-width:420px;}
  .slider-readout{
    display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
  }
  .slider-readout .big{
    font-family:'Noto Serif TC',serif; font-size:30px; font-weight:700; color:var(--pine);
    min-width:46px;
  }
  .slider-readout .tag{
    font-size:12.5px; padding:3px 10px; border-radius:999px;
    background:var(--pine-tint); color:var(--pine); font-weight:500;
  }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:999px;
    background:linear-gradient(90deg, var(--jade-line), var(--amber) 50%, var(--cinnabar));
    outline:none; cursor:pointer; margin:6px 0 8px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:24px; height:24px; border-radius:50%;
    background:var(--paper-card); border:3px solid var(--pine);
    box-shadow:0 2px 6px rgba(38,36,32,.25);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:24px; height:24px; border-radius:50%;
    background:var(--paper-card); border:3px solid var(--pine);
    box-shadow:0 2px 6px rgba(38,36,32,.25);
    cursor:pointer; border-style:solid;
  }
  .slider-scale{
    display:flex; justify-content:space-between;
    font-size:11.5px; color:var(--ink-faint);
  }

  .branch-note{
    font-size:13px; color:var(--ink-soft);
    background:var(--jade-mist); border-radius:var(--radius-sm);
    padding:12px 14px; margin-bottom:22px;
  }

  /* ============ NAV ============ */
  .nav-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:34px; padding-top:22px; border-top:1px solid var(--line);
  }
  .btn{
    border:none; cursor:pointer; border-radius:999px;
    font-size:14px; font-weight:600; padding:12px 24px;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--pine); color:var(--paper);}
  .btn-primary:hover{background:var(--pine-deep);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--pine); color:var(--pine);}
  .btn[disabled]{opacity:.35; cursor:not-allowed;}
  .step-tag{font-size:12px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}

  /* ============ SUMMARY ============ */
  .flag-band{
    border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;
    border:1.5px solid transparent;
  }
  .flag-band h3{margin:0 0 4px; font-size:17px; display:flex; align-items:center; gap:9px;}
  .flag-band .en{font-size:12px; display:block; margin-bottom:10px;}
  .flag-band ul{margin:0; padding-left:0; list-style:none;}
  .flag-band li{
    padding:9px 0; border-top:1px dashed rgba(0,0,0,.08);
    font-size:13.5px;
  }
  .flag-band li:first-child{border-top:none;}
  .flag-band li .li-en{display:block; font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; flex:none;}

  .flag-urgent{background:var(--cinnabar-soft); border-color:rgba(156,59,46,.3);}
  .flag-urgent h3{color:var(--cinnabar-deep);}
  .flag-urgent .dot{background:var(--cinnabar);}

  .flag-screen{background:var(--amber-soft); border-color:rgba(185,134,63,.35);}
  .flag-screen h3{color:var(--amber-deep);}
  .flag-screen .dot{background:var(--amber);}

  .flag-tcm{background:var(--pine-tint); border-color:rgba(31,58,48,.25);}
  .flag-tcm h3{color:var(--pine);}
  .flag-tcm .dot{background:var(--pine);}

  .flag-clear{
    background:var(--paper); border:1.5px dashed var(--jade-line);
    border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;
    font-size:13.5px; color:var(--ink-soft);
  }

  /* ---- question group dividers (within a long section) ---- */
  .group-divider{
    display:flex; align-items:center; gap:10px;
    margin:30px 0 16px; padding-top:6px;
  }
  .group-divider:first-child{margin-top:4px;}
  .group-divider .gd-text{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:13.5px; color:var(--amber-deep);
    white-space:nowrap;
  }
  .group-divider .gd-text .en{display:block; font-size:10.5px; font-weight:400; margin-top:1px;}
  .group-divider::after{content:''; flex:1; height:1px; background:var(--line);}

  /* ---- domain report cards ---- */
  .top-urgent{margin-bottom:24px;}

  /* ---- dashboard grid ---- */
  .dashboard-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:28px;
  }
  @media (max-width:640px){ .dashboard-grid{grid-template-columns:1fr;} }

  /* ---- dashboard card ---- */
  .domain-card{
    background:var(--paper-card);
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    border-left:5px solid var(--jade-line);
    padding:16px 16px 14px;
    display:flex; flex-direction:column; gap:0;
    box-shadow:0 1px 3px rgba(38,36,32,.04);
    transition:box-shadow .2s ease;
  }
  .domain-card:hover{box-shadow:0 4px 14px -4px rgba(38,36,32,.14);}
  .domain-card.status-urgent{border-left-color:var(--cinnabar);}
  .domain-card.status-screen{border-left-color:var(--amber);}
  .domain-card.status-tcm{border-left-color:var(--pine);}
  .domain-card.status-clear{border-left-color:var(--jade-line); background:var(--paper);}

  .card-header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:8px; margin-bottom:10px;
  }
  .card-title{
    font-family:'Noto Serif TC',serif; font-size:15px; font-weight:700;
    color:var(--ink); margin:0; line-height:1.3;
  }
  .card-title .en{
    display:block; font-family:'Spectral',serif; font-size:10.5px;
    font-style:italic; color:var(--ink-faint); font-weight:400;
    margin-top:2px;
  }
  .status-dot{
    flex:none; margin-top:3px;
    width:10px; height:10px; border-radius:50%;
  }
  .status-urgent .status-dot{background:var(--cinnabar);}
  .status-screen .status-dot{background:var(--amber);}
  .status-tcm .status-dot{background:var(--pine);}
  .status-clear .status-dot{background:var(--jade-line);}

  .card-divider{height:1px; background:var(--line); margin:0 0 10px;}

  /* status label row */
  .status-label{
    font-size:11px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; margin:0 0 8px;
  }
  .status-urgent .status-label{color:var(--cinnabar-deep);}
  .status-screen .status-label{color:var(--amber-deep);}
  .status-tcm .status-label{color:var(--pine);}
  .status-clear .status-label{color:var(--ink-faint);}

  /* tag chips (inside cards) */
  .card-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .chip{
    font-size:11.5px; font-weight:500; padding:3px 10px;
    border-radius:999px; border:1px solid transparent;
  }
  .status-urgent .chip{color:var(--cinnabar-deep); border-color:rgba(156,59,46,.3); background:var(--cinnabar-soft);}
  .status-screen .chip{color:var(--amber-deep); border-color:rgba(185,134,63,.35); background:var(--amber-soft);}
  .status-tcm .chip{color:var(--pine); border-color:rgba(31,58,48,.25); background:var(--pine-tint);}

  /* action sentence */

function renderMeridian(){

function branchNote(section){
  if(section.id!=='cycle') return '';
  const st = state.answers.basic_status;
  if(st==='pregnant') return `<div class="branch-note">您目前懷孕中，已為您簡化此區題目，僅顯示與婦科診斷史相關的問題。<br><span class="en">Since you're currently pregnant, this section has been simplified to relevant questions only.</span></div>`;
  if(st==='breastfeeding') return `<div class="branch-note">您目前哺乳中，已為您簡化此區題目。<br><span class="en">Since you're currently breastfeeding, this section has been simplified.</span></div>`;
  if(st==='menopause') return `<div class="branch-note">您已停經，此區將聚焦於停經後出血與婦科病史。<br><span class="en">As you are postmenopausal, this section focuses on postmenopausal bleeding and gynecological history.</span></div>`;
  if(st==='never') return `<div class="branch-note">您尚未有過月經，此區多數題目暫不適用，建議於下一步癌症篩查前先諮詢醫師。<br><span class="en">As you have not yet had a period, most items here don't apply — consider consulting a doctor first.</span></div>`;
  return '';
}

function renderOptions(q){
  const val = state.answers[q.id];
  const blockClass = (q.type==='multi' && q.options.length>4) ? 'is-block' : '';
  return `<div class="opt-grid ${blockClass}">` + q.options.map(o=>{
    const selected = q.type==='single' ? val===o.value : Array.isArray(val) && val.includes(o.value);
    return `<button type="button" class="opt ${selected?'is-selected':''}"
      data-qid="${q.id}" data-value="${o.value}" data-qtype="${q.type}" ${o.exclusive?'data-exclusive="1"':''}>
      <span class="zh">${o.zh}</span><span class="en">${o.en}</span>
    </button>`;
  }).join('') + `</div>`;
}

function renderQuestion(q, n){
  let body = '';
  if(q.type==='single' || q.type==='multi'){
    body = renderOptions(q);
  } else if(q.type==='slider'){
    const v = state.answers[q.id]!=null ? state.answers[q.id] : Math.round(((q.min||0)+(q.max||10))/2);
    const labels = q.scaleLabel_zh || ['','',''];
    const labelsEn = q.scaleLabel_en || ['','',''];
    body = `<div class="slider-wrap">
      <div class="slider-readout"><span class="big" id="val-${q.id}">${v}</span><span class="tag">/ ${q.max||10}</span></div>
      <input type="range" min="${q.min||0}" max="${q.max||10}" step="1" value="${v}" data-field="${q.id}" data-numeric="1" data-slider="1">
      <div class="slider-scale">
        <span>${q.min||0} ${labels[0]||''}</span>
        <span>${labels[1]||''}</span>
        <span>${q.max||10} ${labels[2]||''}</span>
      </div>
    </div>`;
  } else if(q.type==='textarea'){
    const v = state.answers[q.id]||'';
    body = `<textarea class="field-text wide" data-field="${q.id}" placeholder="...">${escapeHtml(v)}</textarea>`;
  } else if(q.type==='text'){
    const v = state.answers[q.id]||'';
    body = `<input class="field-text" type="text" data-field="${q.id}" value="${escapeHtml(v)}">`;
  }
  const hint = q.hint_zh ? `<p class="q-hint">${q.hint_zh}<br><span class="en">${q.hint_en||''}</span></p>` : '';
  return `<div class="q-block">
    <p class="q-label"><span class="num">${String(n).padStart(2,'0')}</span>${q.zh}</p>
    <p class="q-en">${q.en}</p>
    ${hint}
    ${body}
  </div>`;
}

function renderSection(section){
  // clear stale answers for hidden questions to keep scoring accurate
  section.questions.forEach(q=>{ if(q.showIf && !q.showIf(state.answers)) delete state.answers[q.id]; });

  const visible = section.questions.filter(q=>!q.showIf || q.showIf(state.answers));
  const active = getActiveSections();
  const idx = active.findIndex(s=>s.id===section.id);
  const isFirst = idx===0;
  const isLast = idx===active.length-1;

  let lastGroup = null, qNum = 0;
  const questionsHtml = visible.map(q=>{
    let divider = '';
    if(q.group && q.group!==lastGroup){
      divider = `<div class="group-divider"><span class="gd-text">${q.group}<span class="en">${q.groupEn||''}</span></span></div>`;
      lastGroup = q.group;
    }
    qNum++;
    return divider + renderQuestion(q, qNum);
  }).join('');

  return `
    <div class="eyebrow">問診記錄 · 第 ${CN_NUM_FULL[idx]} 節 / Section ${idx+1} of ${active.length}</div>
    <h2>${section.zh}</h2>
    <p class="section-en en">${section.en}</p>
    <p class="intro-copy">${section.intro_zh}</p>
    <p class="intro-copy en" style="margin-top:-10px;">${section.intro_en}</p>
    ${branchNote(section)}
    ${questionsHtml}
    <div class="nav-row">
      <button class="btn btn-ghost" data-nav="prev">${isFirst?'← 回到首頁 Intro':'← 上一步 Back'}</button>
      <span class="step-tag">${idx+1} / ${active.length}</span>
      <button class="btn btn-primary" data-nav="next">${isLast?'查看結果摘要 View Summary →':'下一步 Next →'}</button>
    </div>
  `;
}

/* Returns { [domainId]: {urgent:[], screen:[], tcm:[]} }, where each tier
   holds entries of {level, zh, en, tags:[{zh,en}, ...]}. A flag's home
   domain is its own wizard section by default, unless FLAG(...) overrides
   it (used for 白帶/discharge and 乳房/breast). Multiple options that
   share an identical flag (e.g. the gynecological-diagnosis list) collapse
   into one entry, with each selected option's short label kept as a tag —
   this is what lets the report show compact chips instead of repeating
   the same sentence once per selection. */
function computeDomainFlags(){
  const domains = {};
  const entryMap = new Map();
  function add(defaultDomain, flag, tagZh, tagEn){
    if(!flag) return;
    const dId = flag.domain || defaultDomain;
    if(!domains[dId]) domains[dId] = {urgent:[], screen:[], tcm:[]};
    const key = dId+'|'+flag.level+'|'+flag.zh;
    let entry = entryMap.get(key);
    if(!entry){
      entry = {level:flag.level, zh:flag.zh, en:flag.en, tags:[]};
      entryMap.set(key, entry);
      domains[dId][flag.level].push(entry);
    }
    if(tagZh && !entry.tags.some(t=>t.zh===tagZh)) entry.tags.push({zh:tagZh, en:tagEn||''});
  }
  SECTIONS.forEach(sec=>sec.questions.forEach(q=>{
    const val = state.answers[q.id];
    if(val==null) return;
    if(q.type==='single'){
      const o = q.options.find(o=>o.value===val);
      if(o) add(sec.id, o.flag, o.zh, o.en);
    } else if(q.type==='multi'){
      (val||[]).forEach(v=>{ const o=q.options.find(o=>o.value===v); if(o) add(sec.id, o.flag, o.zh, o.en); });
    }
  }));
  return domains;
}

function domainStatus(buckets){
  if(buckets.urgent.length) return 'urgent';
  if(buckets.screen.length) return 'screen';
  if(buckets.tcm.length) return 'tcm';
  return 'clear';
}

/* ============================================================
   7. RENDER — SUMMARY (concise: tags + one action line per tier,
      not a repeated sentence per selected item)
   ============================================================ */
const STATUS_BADGE = {
  urgent:{zh:'需優先處理', en:'Needs prompt attention'},
  screen:{zh:'建議安排檢查', en:'Screening recommended'},
  tcm:{zh:'適合調理討論', en:'Worth a care discussion'},
  clear:{zh:'大致正常', en:'Largely normal'},
};
const TIER_ACTION = {
  urgent:{zh:'請優先處理以上項目，建議儘速就醫評估。', en:'Please address these first — prompt medical evaluation is recommended.'},
  screen:{zh:'建議針對以上項目安排西醫／婦科相關檢查。', en:'Recommend scheduling relevant medical or gynecological screening for these.'},
  tcm:{zh:'以上項目屬於中醫調理可協助的範疇，建議安排諮詢進一步評估體質。', en:'These fall within areas TCM care can help with — worth booking a consultation for a fuller assessment.'},
};

function tierTags(entries){
  const tags = [];
  entries.forEach(e=>(e.tags||[]).forEach(t=>{ if(!tags.some(x=>x.zh===t.zh)) tags.push(t); }));
  return tags;
}

function renderTierCompact(level, entries){
  if(!entries.length) return '';
  const tags = tierTags(entries);
  const action = TIER_ACTION[level];
  return `<div class="tier-block tier-${level}">
    <div class="tier-tags">${tags.map(t=>`<span class="tag-chip">${t.zh}</span>`).join('')}</div>
    <p class="tier-action">${action.zh}<span class="en">${action.en}</span></p>
  </div>`;
}

function renderTopUrgentBanner(domainFlags, activeDomains){
  const groups = [];
  activeDomains.forEach(d=>{
    const b = domainFlags[d.id];
    if(b && b.urgent.length) groups.push({d, tags:tierTags(b.urgent)});
  });
  if(!groups.length) return '';
  return `<div class="flag-band flag-urgent top-urgent">
    <h3><span class="dot"></span>請優先處理以下事項</h3>
    <span class="en">Please address these first</span>
    <div class="top-urgent-groups">
      ${groups.map(g=>`<div class="tu-group"><b>${g.d.zh}</b><div class="tier-tags">${g.tags.map(t=>`<span class="tag-chip">${t.zh}</span>`).join('')}</div></div>`).join('')}
    </div>
    <p class="tier-action" style="margin-top:4px;">${TIER_ACTION.urgent.zh}<span class="en">${TIER_ACTION.urgent.en}</span></p>
  </div>`;
}

/* Short action sentences per tier, card-scale (tighter than top-banner) */
const CARD_ACTION = {
  urgent: zh=>`<strong>請優先確認：</strong>${zh}`,
  screen:  zh=>`<strong>建議安排：</strong>${zh}`,
  tcm:     zh=>`<strong>可進一步調理：</strong>${zh}`,
};
const TIER_SENTENCE = {
  urgent:'建議盡快就醫評估。',
  screen:'建議安排相關檢查，這是正常的預防步驟。',
  tcm:'有機會可以聊聊，看看調理方向是否適合您。',
};
const STATUS_LABEL_TEXT = {
  urgent:'⚑ 需優先處理',
  screen:'· 建議安排檢查',
  tcm:'· 可調理討論',
  clear:'✓ 大致正常',
};

function renderDomainCard(d, buckets){
  const status = domainStatus(buckets);
  const meta = DOMAIN_META[d.id] || {};
  const caveat = meta.caveat ? meta.caveat(state.answers) : null;
  const link = ARTICLE_LINKS[d.id];

  /* Build tier content blocks — one per triggered tier */
  let content = '';
  if(status === 'clear'){
    content = `<p class="card-clear-text">${meta.clear_zh||'—'}</p>`;
  } else {
    ['urgent','screen','tcm'].forEach(level=>{
      const entries = buckets[level];
      if(!entries.length) return;
      const tags = [];
      entries.forEach(e=>(e.tags||[]).forEach(t=>{ if(!tags.some(x=>x.zh===t.zh)) tags.push(t); }));
      const chipsHtml = tags.length
        ? `<div class="card-chips">${tags.map(t=>`<span class="chip">${t.zh}</span>`).join('')}</div>`
        : '';
      content += `${chipsHtml}<p class="card-action">${CARD_ACTION[level](TIER_SENTENCE[level])}</p>`;
    });
  }

  return `<div class="domain-card status-${status}">
    <div class="card-header">
      <h3 class="card-title">${d.zh}<span class="en">${d.en}</span></h3>
      <span class="status-dot"></span>
    </div>
    <div class="card-divider"></div>
    <p class="status-label">${STATUS_LABEL_TEXT[status]}</p>
    ${content}
    ${caveat ? `<p class="domain-caveat">⚑ ${caveat.zh}</p>` : ''}
    <a class="article-link" href="${link||'#'}" target="_blank" rel="noopener">閱讀完整文章 →</a>
  </div>`;
}

function buildPrintRecap(){
  const rows = [];
  SECTIONS.forEach(sec=>{
    const answered = sec.questions.filter(q=>state.answers[q.id]!=null && state.answers[q.id]!=='' &&
      !(Array.isArray(state.answers[q.id]) && state.answers[q.id].length===0));
    if(!answered.length) return;
    rows.push(`<h4 style="margin:18px 0 6px;font-size:14px;">${sec.zh} ${sec.en}</h4>`);
    answered.forEach(q=>{
      const v = state.answers[q.id];
      let display = '';
      if(q.type==='single'){ const o=q.options.find(o=>o.value===v); display = o? `${o.zh} (${o.en})` : v; }
      else if(q.type==='multi'){ display = v.map(val=>{ const o=q.options.find(o=>o.value===val); return o? o.zh : val; }).join('、'); }
      else { display = escapeHtml(v); }
      rows.push(`<p style="margin:3px 0;font-size:12.5px;"><b>${q.zh}：</b>${display}</p>`);
    });
  });
  return rows.join('');
}

/* ------------------------------------------------------------------
   Warm overall overview — the first thing the person reads.
   Generates an opening sentence + per-domain status chips.
   Tone: like a caring, responsible friend who knows the facts.
   ------------------------------------------------------------------ */
function buildOverview(domainFlags, activeDomains){
  let urgentDomains=[], screenDomains=[], tcmDomains=[], clearDomains=[];
  activeDomains.forEach(d=>{
    const b = domainFlags[d.id] || {urgent:[],screen:[],tcm:[]};
    const s = domainStatus(b);
    if(s==='urgent') urgentDomains.push(d);
    else if(s==='screen') screenDomains.push(d);
    else if(s==='tcm') tcmDomains.push(d);
    else clearDomains.push(d);
  });

  // --- pick the opening headline & body based on overall picture ---
  let headline='', body='', bodyEn='';

  if(urgentDomains.length){
    headline = '有幾項要請您優先留意';
    const names = urgentDomains.map(d=>d.zh).join('、');
    body = `整體來說，大部分面向的狀況是可以掌握的。不過在${names}這些部分，問卷發現了一些值得盡快確認的徵象。這不代表一定有問題，但及早了解會讓您更安心，也更好處理。下面各個面向都有詳細說明。`;
    bodyEn = `Overall, most areas look manageable. However, there are a few things in ${urgentDomains.map(d=>d.en).join(', ')} that are worth checking on promptly. This doesn't necessarily mean something is wrong — but getting clarity early is always the better choice. Details are in each card below.`;
  } else if(screenDomains.length && tcmDomains.length){
    headline = '整體狀況不錯，有幾件事可以安排一下';
    const sNames = screenDomains.map(d=>d.zh).join('、');
    const tNames = tcmDomains.map(d=>d.zh).join('、');
    body = `您目前的整體健康狀況是良好的。在${sNames}方面，建議安排相關的定期檢查，這是很正常的預防醫學步驟，不用擔心。${tNames}這些部分，有些地方適合進一步調理或評估，有興趣的話可以和我聊聊。`;
    bodyEn = `Your overall health picture looks good. For ${screenDomains.map(d=>d.en).join(', ')}, scheduling some routine screening would be a sensible next step — totally normal preventive care, nothing to worry about. For ${tcmDomains.map(d=>d.en).join(', ')}, there are some areas that may benefit from further support if you're interested.`;
  } else if(screenDomains.length){
    headline = '整體狀況良好，有幾項篩查可以安排';
    const names = screenDomains.map(d=>d.zh).join('、');
    body = `您的整體狀況看起來不錯。在${names}方面，建議趁這個機會安排一下相關的定期檢查，這是女性健康維護很重要的一環，不需要因為這些才來才說明有問題。`;
    bodyEn = `Your overall picture looks good. For ${screenDomains.map(d=>d.en).join(', ')}, it would be worth scheduling the relevant routine checks — this is an important part of women's preventive care, and these suggestions don't mean anything is wrong.`;
  } else if(tcmDomains.length){
    headline = '整體狀況良好，有幾個地方可以好好調理';
    const names = tcmDomains.map(d=>d.zh).join('、');
    body = `整體來說，您的身體狀況是好的。在${names}這些面向，有一些地方可以透過適當的調理讓自己更舒適、狀態更穩定，有興趣的話很歡迎進一步聊聊。`;
    bodyEn = `Overall, your health is in good shape. In the areas of ${tcmDomains.map(d=>d.en).join(', ')}, there are some things that could feel better with the right support — very welcome to discuss further if you're curious.`;
  } else {
    headline = '您目前的整體狀況相當不錯';
    body = `問卷填答的結果顯示，您在各個女性健康面向的狀況大致都在正常範圍內。繼續保持良好的生活習慣，定期做篩查，是最好的健康投資。下面還是列出了各個面向的詳細評估，可以對照確認一下。`;
    bodyEn = `Based on your answers, things look largely normal across the women's health areas covered here. Keeping up good habits and routine screening is the best investment you can make. The detailed cards below confirm each area.`;
  }

  // --- per-domain chip row ---
  const chips = activeDomains.map(d=>{
    const s = domainStatus(domainFlags[d.id] || {urgent:[],screen:[],tcm:[]});
    const icon = s==='urgent'?'⚑ ':s==='screen'?'· ':s==='tcm'?'· ':'✓ ';
    return `<span class="ov-chip ov-chip--${s}">${icon}${d.zh}</span>`;
  }).join('');

  return `<div class="overview-block">
    <p class="ov-label">整體評估 Overall Assessment</p>
    <p class="ov-main">${headline}</p>
    <p class="ov-body">${body}<span class="en">${bodyEn}</span></p>
    <div class="overview-chips">${chips}</div>
  </div>`;
}

  const domainCardsHtml = `<div class="dashboard-grid">${activeDomains.map(d=>renderDomainCard(d, domainFlags[d.id] || {urgent:[],screen:[],tcm:[]})).join('')}</div>`;

        : '無論結果如何，定期的整體評估都有助於及早掌握身體狀態。歡迎留下聯絡方式，我們會盡快與您聯繫。'}</p>
      <a href="#contactForm" class="btn btn-primary">留下聯絡方式 Leave Contact Info ↓</a>

    <div class="contact-form" id="contactForm">

      <div class="form-grid">
        <div class="form-field"><label>姓名 Name</label><input class="field-text" type="text" data-contact="name"></div>
        <div class="form-field"><label>Email</label><input class="field-text" type="email" data-contact="email"></div>
        <div class="form-field"><label>電話 Phone</label><input class="field-text" type="tel" data-contact="phone"></div>
        <div class="form-field"><label>方便聯絡時段 Best time to reach you</label><input class="field-text" type="text" data-contact="time"></div>
      </div>
      <div class="form-field" style="margin-top:14px;">

      <div class="confirm-msg" id="confirmMsg"></div>
    </div>

    <div class="summary-actions">
      <button class="btn btn-ghost" data-nav="prev">← 回到上一步修改答案 Edit answers</button>
      <button class="btn btn-ghost" data-nav="print">🖨 列印 / 匯出 PDF Print / Export</button>
    </div>

    <div class="print-only">
      <hr style="margin:24px 0;">
      <h3>完整問卷紀錄 Full Record</h3>

      ${buildPrintRecap()}

}

/* ============================================================
   8. RENDER DISPATCH
   ============================================================ */
function renderCurrentStep(){
  renderMeridian();
  const steps = getSteps();
  const id = steps[state.step];
  if(id==='intro') panel.innerHTML = renderIntro();
  else if(id==='summary') panel.innerHTML = renderSummary();
  else panel.innerHTML = renderSection(SECTIONS.find(s=>s.id===id));
}

/* ============================================================
   9. EVENTS
   ============================================================ */
panel.addEventListener('click', e=>{
  const optBtn = e.target.closest('.opt');
  if(optBtn){
    const qid = optBtn.dataset.qid, val = optBtn.dataset.value, qtype = optBtn.dataset.qtype;
    if(qtype==='single'){
      state.answers[qid] = val;
    } else {
      const q = findQuestion(qid);
      let arr = state.answers[qid] ? [...state.answers[qid]] : [];
      const isExclusive = optBtn.dataset.exclusive==='1';
      const exclusiveVals = q.options.filter(o=>o.exclusive).map(o=>o.value);
      if(isExclusive){
        arr = arr.includes(val) ? [] : [val];
      } else {
        arr = arr.filter(v=>!exclusiveVals.includes(v));
        arr = arr.includes(val) ? arr.filter(v=>v!==val) : [...arr, val];
      }
      state.answers[qid] = arr;
    }
    renderCurrentStep();
    return;
  }

  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    const action = navBtn.dataset.nav;
    if(action==='start'){ state.step = 1; renderCurrentStep(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(action==='next'){ state.step = Math.min(state.step+1, getSteps().length-1); renderCurrentStep(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(action==='prev'){ state.step = Math.max(state.step-1, 0); renderCurrentStep(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(action==='print'){ window.print(); return; }
    if(action==='submit-contact'){ submitContact(); return; }
  }
});

panel.addEventListener('input', e=>{
  const f = e.target.closest('[data-field]');
  if(f){
    const qid = f.dataset.field;
    let v = f.value;
    if(f.dataset.numeric==='1') v = v===''? null : Number(v);
    state.answers[qid] = v;
    if(f.dataset.slider==='1'){
      const readout = document.getElementById('val-'+qid);
      if(readout) readout.textContent = v;
    }
    return;
  }
  const c = e.target.closest('[data-contact]');
  if(c){ state.contact[c.dataset.contact] = c.value; }
});

/* Replace this with the clinic's real inbox before publishing */
const CLINIC_EMAIL = 'clinic@example.com';

function showConfirm(zh, en){
  const box = document.getElementById('confirmMsg');
  if(!box) return;
  box.innerHTML = zh + '<br><span class="en">'+en+'</span>';
  box.classList.add('show');
}

function submitContact(){
  const c = state.contact || {};
  if(!c.email && !c.phone){
    showConfirm('請至少留下 Email 或電話，方便我們與您聯繫。','Please leave an email or phone number so we can reach you.');
    return;
  }
  const domainFlags = computeDomainFlags();
  const lines = [];
  getActiveReportDomains().forEach(d=>{
    const b = domainFlags[d.id];
    if(!b) return;
    ['urgent','screen','tcm'].forEach(lvl=>b[lvl].forEach(f=>{
      const tagList = (f.tags||[]).map(t=>t.zh).join('、');
      lines.push('· ['+d.zh+' / '+STATUS_BADGE[lvl].zh+'] '+(tagList||f.zh));
    }));
  });

  const subject = '女性健康篩查問卷 - 預約諮詢需求';
  const body = [
    '姓名 Name：' + (c.name || '(未填寫)'),
    'Email：' + (c.email || '(未填寫)'),
    '電話 Phone：' + (c.phone || '(未填寫)'),
    '方便聯絡時段：' + (c.time || '(未填寫)'),
    '',
    '想和醫師說明的狀況：',
    c.note || '(無)',
    '',
    '問卷摘要重點：',
    lines.length ? lines.join('\n') : '（未發現明顯警訊）',
    '',
    '※完整問卷內容請參考使用者列印 / 匯出之 PDF 報告。'
  ].join('\n');

  window.location.href = 'mailto:' + CLINIC_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  showConfirm('已為您開啟郵件程式，請確認寄出；您也可以直接列印此頁帶至診所。','Your email app should now open — please confirm sending, or print this page to bring along.');
}

/* ============================================================
   10. INIT
   ============================================================ */
renderCurrentStep();

/* ============================================================
   11. SITE NAV — mobile toggle
   ============================================================ */
(function(){
  const toggle = document.getElementById('siteToggle');
  const links = document.getElementById('siteLinks');
  if(!toggle || !links) return;
  toggle.addEventListener('click', ()=>{
    const open = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  links.addEventListener('click', e=>{
    if(e.target.tagName === 'A'){
      links.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
})();
