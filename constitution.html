<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="中醫體質評估｜胡佩珊中醫師">
  <meta property="og:description" content="免費九種體質自我評估問卷，幾分鐘了解自己屬於哪種中醫體質，並獲得專屬飲食與調理建議。">
  <meta property="og:url" content="https://coolicesan.github.io/TCM-personal-website/constitution.html">
  <meta property="og:image" content="https://coolicesan.github.io/TCM-personal-website/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://coolicesan.github.io/TCM-personal-website/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Hero header ── */
    .cq-hero {
      position: relative;
      background:
        radial-gradient(120% 140% at 15% 0%, #fff 0%, var(--blush) 45%, var(--blush) 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding: 3.5rem clamp(1.5rem, 5vw, 4rem) 3rem;
      overflow: hidden;
    }
    .cq-hero::before,
    .cq-hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .cq-hero::before {
      width: 260px; height: 260px;
      top: -120px; right: -60px;
      background: radial-gradient(circle, rgba(176,107,92,.14), transparent 70%);
    }
    .cq-hero::after {
      width: 220px; height: 220px;
      bottom: -110px; left: -50px;
      background: radial-gradient(circle, rgba(163,143,126,.16), transparent 70%);
    }
    .cq-hero-inner { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; }
    .cq-emblem {
      width: 58px; height: 58px; margin: 0 auto 1.1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
      border-radius: 50%;
      background: #fff;
      border: 1.5px solid var(--border);
      box-shadow: 0 6px 20px rgba(61,36,53,.08);
      color: var(--plum);
    }
    .cq-hero .section-tag { margin-bottom: .85rem; }
    .cq-hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4.5vw, 2.3rem);
      color: var(--plum);
      line-height: 1.35;
      margin-bottom: .35rem;
    }
    .cq-hero-rule {
      width: 54px; height: 3px; margin: .9rem auto 1.1rem;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--sage), var(--terracotta));
    }
    .cq-hero-desc {
      color: var(--text-light);
      font-size: .96rem;
      line-height: 1.85;
      margin: 0 auto;
    }

    /* ── Sticky progress bar ── */
    .cq-progress-shell {
      position: sticky; top: 64px; z-index: 40;
      background: rgba(250, 247, 242, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: .85rem clamp(1.5rem, 5vw, 4rem);
    }
    .cq-progress-inner { max-width: 800px; margin: 0 auto; }
    .cq-progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .55rem;
    }
    .cq-progress-step {
      font-size: .82rem; font-weight: 600; color: var(--plum);
      display: flex; align-items: center; gap: .45rem;
    }
    .cq-progress-step::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--terracotta);
    }
    .cq-progress-hint { font-size: .78rem; color: var(--text-light); }
    .cq-progress-meta.is-intro { display: none; }

    .quiz-progress { margin-bottom: 0 !important; height: 6px !important; }

    .quiz-body { padding-top: 2.5rem !important; }

    /* ── Footer refinement ── */
    .footer { text-align: center; }
    .footer-note-rule {
      width: 40px; height: 2px; margin: 0 auto 1.1rem;
      background: rgba(255,255,255,.35); border-radius: 99px;
    }

    @media (max-width: 600px) {
      .cq-hero { padding: 2.75rem 1.25rem 2.5rem; }
      .cq-progress-shell { padding: .7rem 1.25rem; }
    }

    /* ── Page header for each section ── */
    .cq-page-header {
      background: linear-gradient(135deg, var(--blush) 0%, #fff 100%);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem 1.25rem;
      margin-bottom: 1.5rem;
      border: 1.5px solid var(--border);
    }
    .cq-page-step {
      font-size: .73rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: .4rem;
    }
    .cq-page-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--plum);
      margin-bottom: .25rem;
    }
    .cq-page-tagline {
      font-size: .9rem;
      color: var(--text-light);
      margin-bottom: .6rem;
    }
    .cq-page-hint {
      font-size: .82rem;
      color: var(--text-light);
      background: #fff;
      display: inline-block;
      padding: .2rem .7rem;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    /* ── Scale legend ── */
    .cq-scale-legend {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      font-size: .79rem;
      color: var(--text-light);
    }
    .cq-scale-legend span { display: flex; gap: .2rem; align-items: center; }
    .cq-scale-legend strong { color: var(--plum); font-size: .85rem; }

    /* ── Questions ── */
    .question-block {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem 1.2rem;
      margin-bottom: .75rem;
      transition: border-color .15s;
    }
    .question-block:focus-within { border-color: var(--plum-light); }
    .question-text {
      font-size: .94rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: .85rem;
      font-weight: 500;
    }
    .options-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .35rem;
    }
    .options-scale input[type=radio] { display: none; }
    .options-scale label {
      display: block;
      text-align: center;
      padding: .5rem .2rem;
      font-size: .76rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      background: var(--cream);
      color: var(--text-light);
      transition: all .15s;
      line-height: 1.3;
    }
    .options-scale input[type=radio]:checked + label {
      background: var(--plum);
      border-color: var(--plum);
      color: #fff;
      font-weight: 500;
    }
    .options-scale label:hover { border-color: var(--plum-light); background: var(--blush); color: var(--plum); }

    /* ── Navigation ── */
    .cq-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1.5px solid var(--border);
    }

    /* ── Results card ── */
    .results-container { scroll-margin-top: 112px; }
    .result-card { display: none; }
    .result-card.active { display: block; }

    /* ── Radar chart container ── */
    .cq-radar-wrap {
      display: flex;
      justify-content: center;
      padding: .5rem 0 1rem;
    }

    /* ── Scoring logic box ── */
    .cq-logic-box {
      margin-top: 1rem;
      background: var(--cream);
      border-radius: var(--radius);
      padding: .9rem 1.1rem;
      border-left: 3px solid var(--plum-light);
    }
    .cq-logic-title { font-size: .85rem; font-weight: 600; color: var(--plum); margin-bottom: .6rem; }
    .cq-logic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .cq-logic-label { font-size: .72rem; color: var(--text-light); margin-bottom: .15rem; font-weight: 500; }
    .cq-logic-val { font-size: .78rem; color: var(--text); line-height: 1.6; }

    /* ── Name gate ── */
    .cq-name-badge {
      animation: cqPopIn .55s cubic-bezier(.34,1.56,.64,1) both;
      border-color: var(--dusty-rose);
    }
    @keyframes cqPopIn {
      from { opacity: 0; transform: scale(.7) rotate(-12deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    .cq-name-gate {
      max-width: 360px; margin: 0 auto;
      display: flex; flex-direction: column; gap: .85rem;
      animation: cqFadeUp .5s cubic-bezier(.34,1.56,.64,1) .1s both;
    }
    @keyframes cqFadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cq-name-input {
      width: 100%; padding: .95rem 1.4rem;
      border: 1.5px solid var(--border); border-radius: 999px;
      background: #fff; font-family: var(--font-body);
      font-size: 1rem; color: var(--text);
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .cq-name-input::placeholder { color: var(--text-light); opacity: .65; }
    .cq-name-input:focus {
      outline: none; border-color: var(--dusty-rose);
      box-shadow: 0 0 0 4px rgba(201,143,130,0.16);
    }
    .cq-name-error {
      font-size: .82rem; color: var(--terracotta); text-align: center;
    }
    .cq-name-btn { width: 100%; justify-content: center; }

    /* ── Version selector ── */
    .cq-version-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem;
      max-width: 540px;
      margin: 0 auto;
    }
    .cq-version-card {
      position: relative;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem 1.25rem 2rem;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }
    .cq-version-card:hover {
      border-color: var(--plum-light);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(61,36,53,.1);
    }
    .cq-version-card-featured {
      border-color: var(--plum);
      background: linear-gradient(135deg, var(--blush) 0%, #fff 100%);
    }
    .cq-version-badge {
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      background: var(--plum); color: #fff;
      font-size: .72rem; font-weight: 600;
      padding: .2rem .75rem; border-radius: 99px;
      letter-spacing: .05em;
    }
    .cq-version-icon { font-size: 2.2rem; margin-bottom: .6rem; }
    .cq-version-name {
      font-family: var(--font-display);
      font-size: 1.35rem; color: var(--plum); margin-bottom: .35rem;
    }
    .cq-version-stat {
      font-size: .8rem; color: var(--terracotta);
      font-weight: 500; margin-bottom: 1.1rem;
    }
    .cq-version-desc {
      font-size: .82rem; color: var(--text-light);
      line-height: 1.6; margin-bottom: 1rem;
    }
    .cq-version-btn {
      font-size: .85rem; color: var(--plum); font-weight: 500;
    }
    .cq-version-card:hover .cq-version-btn { text-decoration: underline; }

    /* ── Photo upload ── */
    .tongue-photo-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: var(--cream);
      margin-bottom: .5rem;
    }
    .tongue-photo-zone:hover { border-color: var(--sage); background: #F5F0EC; }
    .tongue-photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
    .tongue-photo-icon { font-size: 2rem; line-height: 1; }
    .tongue-photo-cta { font-size: .88rem; color: var(--plum); font-weight: 500; }
    .tongue-photo-sub { font-size: .75rem; color: var(--text-light); }
    .tongue-photo-preview {
      width: 100%; max-height: 220px;
      object-fit: contain;
      border-radius: var(--radius);
      display: block;
    }

    /* ── Tongue analysis page ── */
    .tongue-section { margin-bottom: 1.5rem; }
    .tongue-q-title {
      font-size: .9rem; font-weight: 600; color: var(--plum);
      margin-bottom: .75rem; display: flex; align-items: center; gap: .5rem;
    }
    .tongue-multi-hint {
      font-size: .72rem; font-weight: 400; color: var(--text-light);
      background: var(--cream); padding: .1rem .45rem; border-radius: 99px;
      border: 1px solid var(--border);
    }

    /* Tongue color buttons */
    .tongue-color-grid { display: flex; gap: .6rem; flex-wrap: wrap; }
    .tongue-color-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: .25rem; padding: .65rem .9rem; border-radius: var(--radius);
      border: 2.5px solid transparent; cursor: pointer;
      min-width: 72px; transition: all .15s; font-family: var(--font-body);
    }
    .tongue-color-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .tongue-color-btn.active { border-color: var(--plum); box-shadow: 0 0 0 2px var(--blush); }
    .tcb-label { font-size: .9rem; font-weight: 600; }
    .tcb-hint { font-size: .68rem; opacity: .8; }

    /* Coat color buttons */
    .tongue-coat-grid { display: flex; gap: .55rem; flex-wrap: wrap; }
    .tongue-coat-btn {
      padding: .55rem 1rem; border-radius: var(--radius); border: 2px solid var(--border);
      cursor: pointer; font-size: .85rem; font-family: var(--font-body);
      color: var(--text); transition: all .15s;
    }
    .tongue-coat-btn:hover { border-color: var(--plum-light); }
    .tongue-coat-btn.active { border-color: var(--plum); background: var(--blush); font-weight: 500; }

    /* Pill buttons (thickness) */
    .tongue-pill-grid { display: flex; gap: .55rem; flex-wrap: wrap; }
    .tongue-pill-btn {
      padding: .45rem 1.1rem; border-radius: 99px; border: 1.5px solid var(--border);
      cursor: pointer; font-size: .85rem; font-family: var(--font-body);
      background: var(--cream); color: var(--text); transition: all .15s;
    }
    .tongue-pill-btn:hover { border-color: var(--plum-light); }
    .tongue-pill-btn.active { border-color: var(--plum); background: var(--blush); color: var(--plum); font-weight: 500; }

    /* Checkboxes */
    .tongue-check-grid { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tongue-check-label {
      display: flex; align-items: center; gap: .35rem;
      padding: .4rem .85rem; border-radius: 99px;
      border: 1.5px solid var(--border); cursor: pointer;
      font-size: .84rem; color: var(--text); background: var(--cream);
      transition: all .15s; user-select: none;
    }
    .tongue-check-label:hover { border-color: var(--plum-light); }
    .tongue-check-label input { accent-color: var(--plum); }
    .tongue-check-label:has(input:checked) { border-color: var(--plum); background: var(--blush); color: var(--plum); }

    /* Tongue result display */
    .cq-tongue-hints { display: flex; flex-direction: column; gap: .65rem; }
    .cq-tongue-item {
      display: flex; gap: .75rem; align-items: flex-start;
      padding: .6rem .8rem; background: var(--cream); border-radius: 8px;
    }
    .cq-tongue-type {
      font-size: .72rem; font-weight: 600; color: var(--terracotta);
      background: #FDF0E8; padding: .15rem .5rem; border-radius: 4px;
      white-space: nowrap; margin-top: .05rem;
    }
    .cq-tongue-text { font-size: .85rem; color: var(--text); line-height: 1.65; }

    /* Tendency tags */
    .cq-tend-tag {
      display: inline-block; padding: .25rem .75rem; border-radius: 99px;
      border: 1.5px solid; font-size: .82rem; font-weight: 500;
    }

    /* ── Result: refined layout ── */
    .cq-result-hero {
      text-align: center;
      padding: 2rem 1.25rem 1.75rem;
      margin-bottom: 1.25rem;
    }
    .cq-result-emblem {
      width: 76px; height: 76px; margin: 0 auto 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; border-radius: 50%;
    }
    .cq-result-portrait {
      width: 240px; height: 240px; margin: 0 auto 1.5rem;
      border-radius: 50%; border: 5px solid var(--border);
      overflow: hidden; box-shadow: 0 8px 32px rgba(61,36,53,0.16);
    }
    .cq-result-portrait img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .cq-result-kicker {
      font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--terracotta); margin-bottom: .5rem;
      text-align: center;
    }
    .cq-result-name {
      font-family: var(--font-display);
      font-size: 3rem; color: var(--plum); line-height: 1.2;
      margin-bottom: .4rem;
      text-align: center;
    }
    .cq-result-tag { color: var(--text-light); font-size: .98rem; text-align: center; }
    .cq-result-note {
      font-size: .84rem; color: var(--text-light);
      margin-top: .6rem; max-width: 420px; margin-left: auto; margin-right: auto;
      text-align: center;
    }

    /* Summary strip */
    .cq-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .cq-summary-item {
      background: #fff; border: 1.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.1rem 1.25rem;
      border-top: 4px solid var(--c, var(--plum));
      text-align: center;
    }
    .cq-summary-role {
      font-size: .72rem; letter-spacing: .08em; color: var(--text-light);
      margin-bottom: .45rem;
    }
    .cq-summary-name {
      font-family: var(--font-display); font-size: 1.25rem;
      color: var(--plum); margin-bottom: .35rem;
    }
    .cq-summary-score {
      font-size: 1.9rem; font-weight: 700; color: var(--c, var(--plum));
      line-height: 1; font-family: var(--font-display);
    }
    .cq-summary-score span { font-size: .82rem; font-weight: 400; margin-left: .15rem; color: var(--text-light); }
    .cq-summary-hint { font-size: .78rem; color: var(--text-light); }
    .cq-summary-none { border-top-color: var(--border); background: var(--cream); }

    /* Content blocks */
    .cq-block {
      background: #fff; border: 1.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.5rem 1.5rem 1.6rem;
      margin-bottom: 1.25rem;
    }
    .cq-block-title {
      font-family: var(--font-display); font-size: 1.15rem;
      color: var(--plum); margin-bottom: .35rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .cq-block-title::before {
      content: ''; width: 4px; height: 18px; border-radius: 99px;
      background: linear-gradient(var(--sage), var(--terracotta));
    }
    .cq-block-sub { font-size: .82rem; color: var(--text-light); margin-bottom: 1rem; }
    .cq-block-text { line-height: 1.95; color: var(--text); margin-top: .75rem; }

    /* Diet grid */
    .cq-diet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .cq-diet-head {
      font-size: .85rem; font-weight: 600; margin-bottom: .6rem;
    }
    .cq-diet-good { color: var(--plum); }
    .cq-diet-avoid { color: var(--terracotta); }

    /* Secondary card */
    .cq-sec-card {
      background: linear-gradient(135deg, var(--cream) 0%, #fff 60%);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--c, var(--plum));
      border-radius: var(--radius-lg);
      padding: 1.35rem 1.5rem 1.4rem;
      margin-bottom: 1.25rem;
    }
    .cq-sec-head { display: flex; align-items: center; gap: .85rem; margin-bottom: .85rem; }
    .cq-sec-emoji {
      font-size: 1.6rem; width: 46px; height: 46px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 50%; border: 1.5px solid var(--border);
    }
    .cq-sec-label { font-size: .72rem; letter-spacing: .08em; color: var(--text-light); }
    .cq-sec-name { font-family: var(--font-display); font-size: 1.25rem; color: var(--plum); }
    .cq-sec-desc { font-size: .88rem; line-height: 1.85; color: var(--text-light); }
    .cq-sec-note { font-size: .78rem; color: var(--text-light); margin-top: .9rem; opacity: .85; }

    .cq-warning { margin-bottom: 1.5rem; }
    .cq-actions {
