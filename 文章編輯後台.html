<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章編輯後台｜胡佩珊中醫師</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --plum:#3D2645; --plum-deep:#251830;
    --rose:#B05870; --rose-light:#FAF0F3; --rose-mid:#E8C0CB;
    --jade:#4A7C6B; --jade-light:#EAF3EF;
    --gold:#B8860B; --gold-light:#FBF5E6;
    --danger:#C0392B; --danger-light:#FDF0EE;
    --ink:#1E2028; --ink-mid:#4A4E5A; --ink-soft:#787D8C;
    --border:#E2E6E0; --bg:#FAFAF8; --white:#fff;
    --serif:'Noto Serif TC',Georgia,serif; --sans:'Noto Sans TC',-apple-system,sans-serif;
  }
  html,body{height:100%}
  body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

  /* ===== Top bar ===== */
  .topbar{height:54px;background:linear-gradient(135deg,var(--plum) 0%,var(--plum-deep) 100%);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;flex-shrink:0}
  .topbar-logo{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap}
  .topbar-logo span{color:#C4AED0;font-weight:400;font-size:12px;margin-left:8px}
  .topbar-file{flex:1;font-size:13px;color:#C8BAD4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-file strong{color:#fff;font-weight:600}
  .dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:8px;vertical-align:middle;visibility:hidden}
  .dirty-dot.show{visibility:visible}
  .btn{border:0;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:transform .12s,opacity .12s;white-space:nowrap}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-save{background:#fff;color:var(--plum)}
  .btn-dl{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .btn-ghost{background:transparent;color:#C8BAD4;border:1px solid rgba(255,255,255,.25)}

  /* ===== Layout ===== */
  .main{flex:1;display:flex;min-height:0}

  /* ===== Sidebar ===== */
  .sidebar{width:272px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .side-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
  .side-title{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--rose);letter-spacing:.08em;margin-bottom:10px}
  .btn-folder{width:100%;background:var(--rose);color:#fff;border-radius:8px;padding:10px}
  .btn-folder.small{background:var(--rose-light);color:var(--rose);margin-top:8px}
  .side-search{width:100%;margin-top:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--bg)}
  .side-search:focus{outline:none;border-color:var(--rose)}
  .file-list{flex:1;overflow-y:auto;padding:8px}
  .file-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
  .file-item:hover{background:var(--rose-light)}
  .file-item.active{background:var(--rose-light);border-color:var(--rose-mid)}
  .file-item-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4;display:flex;align-items:flex-start;gap:6px}
  .file-item-title .fdot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:5px;visibility:hidden}
  .file-item.dirty .fdot{visibility:visible}
  .file-item-name{font-size:11px;color:var(--ink-soft);margin-top:3px;word-break:break-all}
  .empty-hint{padding:28px 20px;font-size:13px;color:var(--ink-soft);line-height:1.9;text-align:center}
  .empty-hint b{color:var(--rose)}

  /* ===== Editor area ===== */
  .editor{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .toolbar{height:46px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
  .tool-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-mid);cursor:pointer;user-select:none}
  .switch{width:38px;height:21px;border-radius:20px;background:#CDD2CC;position:relative;transition:background .15s}
  .switch::after{content:'';position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on{background:var(--jade)}
  .switch.on::after{left:19px}
  .tbtn{border:1px solid var(--border);background:var(--white);border-radius:6px;padding:6px 12px;font-size:12.5px;color:var(--ink-mid);cursor:pointer;font-family:var(--sans)}
  .tbtn:hover{border-color:var(--rose);color:var(--rose)}
  .tbtn:disabled{opacity:.4;cursor:not-allowed}
  .tool-sep{width:1px;height:22px;background:var(--border);margin:0 4px}
  .tool-status{margin-left:auto;font-size:12px;color:var(--ink-soft)}
  .tool-status.editing{color:var(--jade);font-weight:600}

  /* ===== SEO meta panel ===== */
  .meta-panel{background:var(--gold-light);border-bottom:1px solid var(--border);padding:10px 14px;display:none;gap:10px;flex-wrap:wrap;flex-shrink:0}
  .meta-panel.show{display:flex}
  .meta-field{flex:1;min-width:240px}
  .meta-field label{display:block;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
  .meta-field input,.meta-field textarea{width:100%;border:1px solid var(--gold);border-radius:6px;padding:7px 10px;font-size:12.5px;font-family:var(--sans);background:#fff;resize:vertical}
  .meta-field .cnt{font-size:10.5px;color:var(--ink-soft);margin-top:2px;text-align:right}
  .meta-field .cnt.over{color:var(--danger);font-weight:700}

  .frame-wrap{flex:1;min-height:0;background:#E9E7E2;padding:0;position:relative}
  #frame{width:100%;height:100%;border:0;background:#fff;display:block}
  .frame-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-soft);font-size:14px;text-align:center;padding:24px;line-height:2}
  .frame-empty .big{font-family:var(--serif);font-size:20px;color:var(--ink-mid);font-weight:700}

  /* ===== Toast ===== */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;transition:transform .25s;z-index:99;max-width:88vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--jade)}
  .toast.err{background:var(--danger)}

  @media(max-width:760px){
    .sidebar{width:210px}
    .topbar-logo span{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">✎ 文章編輯後台<span>胡佩珊中醫師</span></div>
  <div class="topbar-file" id="currentFile">未開啟文章</div>
  <span class="dirty-dot" id="dirtyDot" title="有未儲存的修改"></span>
  <button class="btn btn-ghost" id="btnMeta" disabled>SEO 資料</button>
  <button class="btn btn-dl" id="btnDownload" disabled>下載檔案</button>
  <button class="btn btn-save" id="btnSave" disabled>儲存回原檔</button>
</header>

<div class="main">

  <aside class="sidebar">
    <div class="side-head">
      <div class="side-title">▸ 文章列表</div>
      <button class="btn btn-folder" id="btnFolder">📂 選擇文章資料夾</button>
      <button class="btn btn-folder small" id="btnFiles">或逐個選取 HTML 檔</button>
      <input type="text" class="side-search" id="search" placeholder="搜尋文章…" disabled>
    </div>
    <div class="file-list" id="fileList">
      <div class="empty-hint">
        按上方 <b>選擇文章資料夾</b>，<br>授權存放文章 HTML 的資料夾，<br>即可載入全部文章並<b>直接儲存回原檔</b>。<br><br>
        （瀏覽器如不支援資料夾授權，<br>可逐個選檔，改完用「下載檔案」覆蓋。）
      </div>
    </div>
  </aside>

  <section class="editor">
    <div class="toolbar">
      <label class="tool-toggle" id="editToggle">
        <span class="switch on" id="switchEl"></span>
        <span>編輯模式</span>
      </label>
      <span class="tool-sep"></span>
      <button class="tbtn" id="btnUndo" disabled>↩ 復原</button>
      <button class="tbtn" id="btnRedo" disabled>↪ 重做</button>
      <button class="tbtn" id="btnBold" disabled>粗體</button>
      <span class="tool-sep"></span>
      <button class="tbtn" id="btnRevert" disabled>還原此篇修改</button>
      <span class="tool-status" id="status">請先開啟文章</span>
    </div>

    <div class="meta-panel" id="metaPanel">
      <div class="meta-field">
        <label>頁面標題 &lt;title&gt;</label>
        <input type="text" id="mTitle">
        <div class="cnt" id="mTitleCnt"></div>
      </div>
      <div class="meta-field">
        <label>Meta Description</label>
        <textarea id="mDesc" rows="2"></textarea>
        <div class="cnt" id="mDescCnt"></div>
      </div>
      <div class="meta-field">
        <label>Keywords</label>
        <input type="text" id="mKeys">
      </div>
    </div>

    <div class="frame-wrap">
      <iframe id="frame" sandbox="allow-same-origin"></iframe>
      <div class="frame-empty" id="frameEmpty">
        <div class="big">所見即所得編輯</div>
        <div>左邊開啟文章後，直接<b>點住文字就可以改</b>，樣式原封不動。<br>改完按右上角「儲存回原檔」，或「下載檔案」覆蓋原檔。<br><small>快捷鍵：Ctrl / ⌘ + S 儲存</small></div>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var SELF_NAMES = ['文章編輯後台.html','editor.html','admin.html'];
  var dirHandle = null;                 // FileSystemDirectoryHandle（可寫回）
  var files = [];                       // {name, handle|file, title, dirty, edited(html string|null)}
  var current = -1;
  var editMode = true;
  var suppressDirty = false;

  var $ = function(id){ return document.getElementById(id); };
  var frame = $('frame');

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg, cls){
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (cls ? ' ' + cls : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2600);
  }

  /* ---------- 載入資料夾 ---------- */
  $('btnFolder').addEventListener('click', async function(){
    if (!window.showDirectoryPicker){
      toast('此瀏覽器不支援資料夾授權，請用「逐個選取」', 'err');
      return;
    }
    try{
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    }catch(e){ return; } /* 使用者取消 */
    files = [];
    for await (var entry of dirHandle.values()){
      if (entry.kind === 'file' && /\.html?$/i.test(entry.name) && SELF_NAMES.indexOf(entry.name) === -1){
        files.push({ name: entry.name, handle: entry, file: null, title: '', dirty: false, edited: null });
      }
    }
    files.sort(function(a,b){ return a.name.localeCompare(b.name, 'zh-Hant'); });
    await readTitles();
    renderList();
    $('search').disabled = files.length === 0;
    toast('已載入 ' + files.length + ' 篇文章（可直接儲存回原檔）', 'ok');
  });

  /* ---------- 後備：逐個選檔 ---------- */
  $('btnFiles').addEventListener('click', function(){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.html,.htm';
    input.multiple = true;
    input.onchange = async function(){
      dirHandle = null;
      files = Array.prototype.map.call(input.files, function(f){
        return { name: f.name, handle: null, file: f, title: '', dirty: false, edited: null };
      }).filter(function(f){ return SELF_NAMES.indexOf(f.name) === -1; });
      await readTitles();
      renderList();
      $('search').disabled = files.length === 0;
      toast('已載入 ' + files.length + ' 篇（此模式改完請用「下載檔案」覆蓋）', 'ok');
    };
    input.click();
  });

  async function readText(f){
    if (f.edited !== null) return f.edited;
    var blob = f.handle ? await f.handle.getFile() : f.file;
    return await blob.text();
  }
  async function readTitles(){
    for (var i = 0; i < files.length; i++){
      try{
        var txt = await readText(files[i]);
        var m = txt.match(/<title>([\s\S]*?)<\/title>/i);
        files[i].title = m ? m[1].trim() : files[i].name;
      }catch(e){ files[i].title = files[i].name; }
    }
  }

  /* ---------- 列表 ---------- */
  function renderList(){
    var q = $('search').value.trim().toLowerCase();
    var box = $('fileList');
    box.innerHTML = '';
    if (!files.length){
      box.innerHTML = '<div class="empty-hint">此資料夾找不到 HTML 檔。</div>';
      return;
    }
    files.forEach(function(f, i){
      if (q && f.title.toLowerCase().indexOf(q) === -1 && f.name.toLowerCase().indexOf(q) === -1) return;
      var d = document.createElement('div');
      d.className = 'file-item' + (i === current ? ' active' : '') + (f.dirty ? ' dirty' : '');
      d.innerHTML = '<div class="file-item-title"><span class="fdot"></span><span></span></div><div class="file-item-name"></div>';
      d.querySelector('.file-item-title span:last-child').textContent = f.title;
      d.querySelector('.file-item-name').textContent = f.name;
      d.addEventListener('click', function(){ openFile(i); });
      box.appendChild(d);
    });
  }
  $('search').addEventListener('input', renderList);

  /* ---------- 開啟文章 ---------- */
  async function openFile(i){
    if (current === i) return;
    if (current > -1 && files[current].dirty){
      stashCurrent(); /* 未儲存的改動先留在記憶體，切返嚟仲喺度 */
    }
    current = i;
    var f = files[i];
    var html = await readText(f);
    suppressDirty = true;
    frame.srcdoc = html;
    frame.onload = function(){
      var doc = frame.contentDocument;
      applyEditMode();
      doc.addEventListener('input', function(){
        if (suppressDirty) return;
        markDirty(true);
      });
      /* 編輯模式下攔截連結，避免跳走 */
      doc.addEventListener('click', function(ev){
        var a = ev.target.closest && ev.target.closest('a');
        if (a) ev.preventDefault();
      }, true);
      doc.addEventListener('keydown', keyHandler);
      loadMeta();
      suppressDirty = false;
    };
    $('frameEmpty').style.display = 'none';
    $('currentFile').innerHTML = '編輯中：<strong></strong>';
    $('currentFile').querySelector('strong').textContent = f.name;
    setDirtyUI(f.dirty);
    ['btnSave','btnDownload','btnMeta','btnUndo','btnRedo','btnBold','btnRevert'].forEach(function(id){ $(id).disabled = false; });
    $('btnSave').disabled = !f.handle;  /* 無 handle（逐個選檔）只能下載 */
    renderList();
    setStatus();
  }

  function stashCurrent(){
    if (current < 0) return;
    files[current].edited = serialize();
  }

  /* ---------- 序列化（還原編輯輔助，輸出乾淨 HTML） ---------- */
  function serialize(){
    var doc = frame.contentDocument;
    var prevMode = doc.designMode;
    doc.designMode = 'off';
    var html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    doc.designMode = prevMode;
    return html;
  }

  /* ---------- dirty ---------- */
  function markDirty(v){
    if (current < 0) return;
    files[current].dirty = v;
    setDirtyUI(v);
    renderList();
  }
  function setDirtyUI(v){
    $('dirtyDot').className = 'dirty-dot' + (v ? ' show' : '');
  }

  /* ---------- 編輯模式 ---------- */
  function applyEditMode(){
    var doc = frame.contentDocument;
    if (!doc) return;
    doc.designMode = editMode ? 'on' : 'off';
    setStatus();
  }
  function setStatus(){
    var s = $('status');
    if (current < 0){ s.textContent = '請先開啟文章'; s.className = 'tool-status'; return; }
    if (editMode){ s.textContent = '● 編輯中——直接點文字修改'; s.className = 'tool-status editing'; }
    else { s.textContent = '預覽模式（唯讀）'; s.className = 'tool-status'; }
  }
  $('editToggle').addEventListener('click', function(){
    editMode = !editMode;
    $('switchEl').className = 'switch' + (editMode ? ' on' : '');
    applyEditMode();
  });

  /* ---------- 工具列 ---------- */
  function cmd(c){ try{ frame.contentDocument.execCommand(c); }catch(e){} }
  $('btnUndo').addEventListener('click', function(){ cmd('undo'); });
  $('btnRedo').addEventListener('click', function(){ cmd('redo'); });
  $('btnBold').addEventListener('click', function(){ cmd('bold'); markDirty(true); });

  $('btnRevert').addEventListener('click', async function(){
    if (current < 0) return;
    if (!confirm('還原「' + files[current].title + '」所有未儲存的修改？')) return;
    files[current].edited = null;
    files[current].dirty = false;
    var i = current; current = -1;
    openFile(i);
    toast('已還原為原檔內容');
  });

  /* ---------- SEO meta 面板 ---------- */
  $('btnMeta').addEventListener('click', function(){
    $('metaPanel').classList.toggle('show');
  });
  function getMetaEl(doc, name){
    return doc.querySelector('meta[name="' + name + '"]');
  }
  function loadMeta(){
    var doc = frame.contentDocument;
    $('mTitle').value = doc.title || '';
    var d = getMetaEl(doc, 'description');
    $('mDesc').value = d ? d.getAttribute('content') : '';
    var k = getMetaEl(doc, 'keywords');
    $('mKeys').value = k ? k.getAttribute('content') : '';
    updCnt();
  }
  function updCnt(){
    var t = $('mTitle').value.length, d = $('mDesc').value.length;
    $('mTitleCnt').textContent = t + ' 字（建議 ≤ 30 中文字）';
    $('mTitleCnt').className = 'cnt' + (t > 32 ? ' over' : '');
    $('mDescCnt').textContent = d + ' 字（建議 70–90 中文字）';
    $('mDescCnt').className = 'cnt' + (d > 95 ? ' over' : '');
  }
  function bindMeta(id, apply){
    $(id).addEventListener('input', function(){
      if (current < 0) return;
      apply(frame.contentDocument, $(id).value);
      updCnt();
      markDirty(true);
    });
  }
  bindMeta('mTitle', function(doc, v){
    doc.title = v;
    var og = doc.querySelector('meta[property="og:title"]'); if (og) og.setAttribute('content', v);
    var tw = getMetaEl(doc, 'twitter:title'); if (tw) tw.setAttribute('content', v);
  });
  bindMeta('mDesc', function(doc, v){
    var m = getMetaEl(doc, 'description'); if (m) m.setAttribute('content', v);
    var og = doc.querySelector('meta[property="og:description"]'); if (og) og.setAttribute('content', v);
    var tw = getMetaEl(doc, 'twitter:description'); if (tw) tw.setAttribute('content', v);
  });
  bindMeta('mKeys', function(doc, v){
    var m = getMetaEl(doc, 'keywords'); if (m) m.setAttribute('content', v);
  });

  /* ---------- 儲存 ---------- */
  async function save(){
    if (current < 0) return;
    var f = files[current];
    var html = serialize();
    if (f.handle){
      try{
        var w = await f.handle.createWritable();
        await w.write(html);
        await w.close();
        f.edited = null;
        markDirty(false);
        toast('✓ 已儲存回原檔：' + f.name, 'ok');
        return;
      }catch(e){
        toast('寫入失敗（' + e.name + '），改用下載覆蓋', 'err');
      }
    }
    download(html, f.name);
  }
  function download(html, name){
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    if (current > -1){ files[current].edited = serialize(); markDirty(false); }
    toast('已下載 ' + name + '，請覆蓋原檔', 'ok');
  }
  $('btnSave').addEventListener('click', save);
  $('btnDownload').addEventListener('click', function(){
    if (current < 0) return;
    download(serialize(), files[current].name);
  });

  /* ---------- 快捷鍵（主頁 + iframe 內都攔 Ctrl/⌘+S） ---------- */
  function keyHandler(e){
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){
      e.preventDefault();
      save();
    }
  }
  document.addEventListener('keydown', keyHandler);

  /* ---------- 離開前提醒 ---------- */
  window.addEventListener('beforeunload', function(e){
    var any = files.some(function(f){ return f.dirty; });
    if (any){ e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
